name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 cppcheck python3
          gcc-14 --version | head -1
          cppcheck --version

      - name: Build and run the test suite (strict warnings, -Werror)
        run: make CC=gcc-14

      - name: Worked example
        run: make example CC=gcc-14

      - name: Property / invariant fuzz (200k iterations)
        run: make fuzz CC=gcc-14

      - name: Static library
        run: make lib CC=gcc-14 && ls -l build/libdal_c.a

      - name: Coverage + traceability + verification + coverage report
        # instrumented run; regenerates docs/traceability.html,
        # docs/verification.html and docs/coverage/; fails under 100% line /
        # 100% MC-DC or on any traceability gap
        run: make report CC=gcc-14

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --std=c99 --enable=warning,style,performance,portability \
                   --inline-suppr --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   -I include src examples

      - name: MISRA C:2012 advisory (cppcheck addon, informational)
        run: |
          cppcheck --std=c99 --addon=misra --enable=all \
                   --suppress=missingIncludeSystem --inline-suppr \
                   -I include src 2>&1 | tee misra.txt || true
          echo "MISRA advisory findings: $(grep -c 'misra-c2012' misra.txt || echo 0)"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  portability:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: clang, opt: "-O2 -g" }
          - { cc: gcc,   opt: "-O2 -g -m32" }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib
      - name: Build and test (${{ matrix.cc }} ${{ matrix.opt }})
        run: make CC=${{ matrix.cc }} OPT="${{ matrix.opt }}"
      - name: Example
        run: make example CC=${{ matrix.cc }} OPT="${{ matrix.opt }}"

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Suite + example under UBSan / ASan
        run: make sanitize CC=clang

  deploy:
    # portability (clang / -m32) runs alongside but does not gate the Pages
    # deploy until it has been confirmed green once.
    needs: [verify, sanitize]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
